# Server configuration
server.port=8080

# SAP Connection Properties
sap.client=800
sap.user=YOUR_SAP_USER
sap.password=YOUR_SAP_PASSWORD
sap.language=EN
sap.host=your-sap-host.com
sap.sysnr=00
sap.destination=SAP_SYSTEM

# Logging
logging.level.com.example.saprfc=DEBUG
logging.level.com.sap.conn.jco=DEBUG
